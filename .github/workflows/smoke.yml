name: Portable dataset checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m benchmarks.verify
      - run: python -m unittest discover -s tests -v
      - run: docker build -t ai-theorist-benchmark-runtime:20261007 -f benchmarks/runtime/Dockerfile benchmarks/runtime
      - run: python -m benchmarks.run --suite smoke --policy oracle --campaign ci --execute
      - run: python -m benchmarks.check_run --campaign ci --expect 3
